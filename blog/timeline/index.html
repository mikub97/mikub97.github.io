<div class="container">

    <h1>Oś czasu</h1>
    <p>Posty w kolejności chronologicznej</p>
  </div>

<div class="container">





<div class="timeline" id="timeline"></div>



</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/blog/assets/js/blog.js"></script>
<script>
(function () {
  // Jedno zrodlo listy: /blog/assets/posts.json. Wpisy osi czasu i dymki na
  // mapie powstaja z tych samych danych, wiec nie moga sie juz rozjechac.
  Blog.load().then(function (newest_first) {
    var posts = newest_first.slice().reverse();   // os czasu idzie chronologicznie

    var tl = document.getElementById("timeline");
    posts.forEach(function (p) {
      var e = document.createElement("div");
      e.className = "timeline-entry";
      if (p.lat != null) { e.dataset.lat = p.lat; e.dataset.lng = p.lng; }
      e.innerHTML =
        '<div class="timeline-date"></div>' +
        (p.location ? '<div class="timeline-location"></div>' : '') +
        '<div class="timeline-title"><a></a></div>';
      e.querySelector(".timeline-date").textContent = Blog.formatDate(p.date);
      if (p.location) e.querySelector(".timeline-location").textContent = p.location;
      var a = e.querySelector(".timeline-title a");
      a.textContent = p.title;
      a.href = Blog.postUrl(p.slug);
      tl.appendChild(e);
    });

    posts = posts.filter(function (p) { return p.lat != null; })
                 .map(function (p) {
                   return {
                     title: p.title, date: Blog.formatDate(p.date),
                     location: p.location, url: Blog.postUrl(p.slug),
                     cover: p.cover, lat: p.lat, lng: p.lng
                   };
                 });

  // Group posts that share the same coordinates
  var byCoord = {};
  posts.forEach(function (p) {
    var key = p.lat + "," + p.lng;
    if (!byCoord[key]) byCoord[key] = { lat: p.lat, lng: p.lng, posts: [] };
    byCoord[key].posts.push(p);
  });

  // Default center: Salvador, Bahia
  var defaultCenter = posts.length ? [posts[0].lat, posts[0].lng] : [-12.97, -38.50];
  var map = L.map("map", { zoomControl: true }).setView(defaultCenter, 6);

  // OpenStreetMap zamiast CARTO: basemaps.cartocdn.com zaczelo wymagac klucza
  // API i od tej pory serwuje kafelki z wypalonym napisem "API KEY REQUIRED".
  // Nie zwraca przy tym bledu - odpowiedz to nadal HTTP 200 - wiec widac to
  // wylacznie na ekranie. OSM nie wymaga klucza; nie obsluguje za to subdomen
  // {s} ani kafelkow retina {r}, stad krotszy adres.
  // Wyszarzenie robi filtr CSS nizej, zeby mapa nie odstawala od palety bloga.
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  var routeCoords = posts.map(function (p) { return [p.lat, p.lng]; });
  if (routeCoords.length > 1) {
    L.polyline(routeCoords, { color: "#c9a227", weight: 2, opacity: 0.5, dashArray: "5, 10" }).addTo(map);
  }

  var markerStyle = { radius: 9, fillColor: "#c9a227", color: "#1a4731", weight: 2, opacity: 1, fillOpacity: 0.92 };
  var markers = [];

  Object.values(byCoord).forEach(function (loc) {
    var m = L.circleMarker([loc.lat, loc.lng], markerStyle).addTo(map);

    var inner = loc.posts.map(function (p) {
      return '<div class="mp-entry">' +
        (p.cover ? '<img class="mp-img" src="' + p.cover + '" alt="">' : "") +
        '<div class="mp-body">' +
        '<div class="mp-date">' + p.date + "</div>" +
        '<a class="mp-title" href="' + p.url + '">' + p.title + "</a>" +
        "</div></div>";
    }).join("");

    var html = '<div class="mp-wrap"><div class="mp-loc">' + (loc.posts[0].location || "") + "</div>" + inner + "</div>";
    m.bindPopup(html, { maxWidth: 220, minWidth: 180 });
    markers.push(m);
  });

  if (markers.length > 1) {
    var group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.4));
  }

  document.querySelectorAll(".timeline-entry[data-lat]").forEach(function (el) {
    el.style.cursor = "pointer";
    el.addEventListener("click", function (e) {
      if (e.target.tagName === "A") return;
      var lat = parseFloat(el.dataset.lat);
      var lng = parseFloat(el.dataset.lng);
      var key = lat + "," + lng;
      var loc = byCoord[key];
      if (!loc) return;
      var target = markers.find(function (mk) {
        return mk.getLatLng().lat === lat && mk.getLatLng().lng === lng;
      });
      if (target) {
        map.setView([lat, lng], 10, { animate: true });
        target.openPopup();
        document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
  });
  });
})();
</script>

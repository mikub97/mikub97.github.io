<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function () {
  const slug = new URLSearchParams(location.search).get('s') || '';

  function showError(msg) {
    const el = document.getElementById('post-error');
    el.textContent = msg;
    el.hidden = false;
  }

  // Lista postow przychodzi z /blog/assets/posts.json (patrz assets/js/blog.js).
  // Post nieobecny w tym pliku jest nieosiagalny - nie ma juz flagi "hidden",
  // ktora i tak zdradzalaby tytul w zrodle strony.
  Blog.load().then(run).catch(() => showError('Nie udalo sie wczytac listy postow.'));

  function run(posts) {
    const idx   = posts.findIndex(p => p.slug === slug);
    const meta  = idx >= 0 ? posts[idx] : null;

    // Unknown or hidden slug: nothing to fetch, and nothing to say about it.
    if (!meta) {
      showError('Nie ma takiego posta.');
      return;
    }

    // Header metadata comes from _data/posts.yml, not from the markdown.
    document.title = meta.title + ' – Viajando';
    document.getElementById('post-date').textContent = Blog.formatDate(meta.date);
    document.getElementById('post-title').textContent = meta.title;
    if (meta.location) {
      document.getElementById('post-location-text').textContent = meta.location;
      document.getElementById('post-location').hidden = false;
    }
    document.getElementById('post-header').hidden = false;

    function setupNav() {
      const nav  = document.getElementById('post-nav');
      const prev = document.getElementById('post-nav-prev');
      const next = document.getElementById('post-nav-next');
      const prevTitle = document.getElementById('post-nav-prev-title');
      const nextTitle = document.getElementById('post-nav-next-title');
      if (idx > 0) {
        const p = posts[idx - 1];
        prevTitle.textContent = p.title;
        prev.href = Blog.postUrl(p.slug);
        prev.hidden = false;
      } else {
        prev.hidden = true;
      }
      if (idx < posts.length - 1) {
        const n = posts[idx + 1];
        nextTitle.textContent = n.title;
        next.href = Blog.postUrl(n.slug);
        next.hidden = false;
      } else {
        next.hidden = true;
      }
      nav.hidden = false;
    }

    // Plain markdown, written by scripts/publish_posts.py with front matter stripped.
    (async () => {
      let raw;
      try {
        const res = await fetch('/blog/assets/posts/' + slug + '.md');
        if (!res.ok) throw new Error(res.status);
        raw = await res.text();
      } catch {
        showError('Nie udało się wczytać treści posta.');
        setupNav();
        return;
      }
      const body = document.getElementById('post-body');
      body.innerHTML = marked.parse(raw);
      body.hidden = false;
      setupNav();
    })();
  }
})();
</script>
